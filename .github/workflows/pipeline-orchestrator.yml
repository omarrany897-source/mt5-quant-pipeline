name: Pipeline Orchestrator

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'What triggered this run'
        required: false
        default: 'manual'
      issue_number:
        description: 'Source issue number (optional)'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
    paths:
      - 'prompts/**'

concurrency:
  group: mt5-pipeline-orchestrator
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  RUN_ID: ${{ github.run_id }}
  BRANCH_NAME: pipeline/run-${{ github.run_id }}
  GEMINI_CLI_TRUST_WORKSPACE: 'true'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pipeline branch
        id: branch
        run: |
          git config user.name "gemini-cli[bot]"
          git config user.email "gemini-cli[bot]@users.noreply.github.com"
          git checkout -b "${{ env.BRANCH_NAME }}"
          jq '.status = "running" | .current_phase = "01-researcher" | .last_run_id = "${{ env.RUN_ID }}"' \
            pipeline/state.json > /tmp/state.json
          mv /tmp/state.json pipeline/state.json
          git add pipeline/state.json
          git commit -m "chore: start pipeline run ${{ env.RUN_ID }}" || true
          git push -u origin "${{ env.BRANCH_NAME }}"
          echo "name=${{ env.BRANCH_NAME }}" >> "$GITHUB_OUTPUT"

  phase-1-researcher:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Agent 1 — Researcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLLAMA_FALLBACK_ENABLED: true
          OLLAMA_MODEL: qwen2.5:3b
          GEMINI_TIMEOUT_SECONDS: 300
          MAX_ATTEMPTS: 1
        run: |
          chmod +x scripts/run-agent-phase.sh
          ./scripts/run-agent-phase.sh 01-researcher outputs/01-researcher.md

      - name: Commit Phase 1 output
        run: |
          chmod +x scripts/commit-phase-output.sh
          ./scripts/commit-phase-output.sh outputs/01-researcher.md 02-analyst ${{ env.RUN_ID }} "" "${{ env.BRANCH_NAME }}"

  phase-2-analyst:
    needs: phase-1-researcher
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Agent 2 — Analyst
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLLAMA_FALLBACK_ENABLED: true
          OLLAMA_MODEL: qwen2.5:3b
          GEMINI_TIMEOUT_SECONDS: 300
          MAX_ATTEMPTS: 1
        run: |
          chmod +x scripts/run-agent-phase.sh
          ./scripts/run-agent-phase.sh 02-analyst outputs/02-analyst.md outputs/01-researcher.md

      - name: Commit Phase 2 output
        run: |
          chmod +x scripts/commit-phase-output.sh
          ./scripts/commit-phase-output.sh outputs/02-analyst.md 03-strategy-designer ${{ env.RUN_ID }} "" "${{ env.BRANCH_NAME }}"

  phase-3-strategy-designer:
    needs: phase-2-analyst
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Agent 3 — Strategy Designer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLLAMA_FALLBACK_ENABLED: true
          OLLAMA_MODEL: qwen2.5:3b
          GEMINI_TIMEOUT_SECONDS: 300
          MAX_ATTEMPTS: 1
        run: |
          chmod +x scripts/run-agent-phase.sh
          ./scripts/run-agent-phase.sh 03-strategy-designer outputs/03-strategy-designer.md outputs/02-analyst.md

      - name: Commit Phase 3 output
        run: |
          chmod +x scripts/commit-phase-output.sh
          ./scripts/commit-phase-output.sh outputs/03-strategy-designer.md 04-mt5-engineer ${{ env.RUN_ID }} "" "${{ env.BRANCH_NAME }}"

  phase-4-mt5-engineer:
    needs: phase-3-strategy-designer
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Agent 4 — MT5 Engineer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLLAMA_FALLBACK_ENABLED: true
          OLLAMA_MODEL: qwen2.5:1.5b
          GEMINI_TIMEOUT_SECONDS: 300
          MAX_ATTEMPTS: 1
        run: |
          chmod +x scripts/run-agent-phase.sh
          ./scripts/run-agent-phase.sh 04-mt5-engineer outputs/04-mt5-engineer.md outputs/03-strategy-designer.md

      - name: Commit Phase 4 output
        run: |
          chmod +x scripts/commit-phase-output.sh
          chmod +x scripts/package-experts.sh
          ./scripts/package-experts.sh Experts outputs/03-strategy-designer.md
          ./scripts/commit-phase-output.sh outputs/04-mt5-engineer.md done ${{ env.RUN_ID }} "Experts/" "${{ env.BRANCH_NAME }}"

  finalize:
    needs: [setup, phase-4-mt5-engineer]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Consolidate final pipeline output
        run: |
          chmod +x scripts/consolidate-final-output.sh
          ./scripts/consolidate-final-output.sh "${{ env.RUN_ID }}"

      - name: Commit final consolidated output
        run: |
          git config user.name "gemini-cli[bot]"
          git config user.email "gemini-cli[bot]@users.noreply.github.com"
          git add outputs/final/ pipeline/state.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "feat(pipeline): final consolidated output [run ${{ env.RUN_ID }}]"
            git push origin "HEAD:${{ env.BRANCH_NAME }}"
          fi

      - name: Upload final output artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-final-${{ env.RUN_ID }}
          path: |
            outputs/final/latest.md
            outputs/final/pipeline-result-${{ env.RUN_ID }}.md
            outputs/
            Experts/
          retention-days: 90

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ needs.setup.outputs.branch }}" \
            --title "Pipeline Run ${{ env.RUN_ID }} — MT5 Research & EA Output" \
            --body "## Automated Pipeline Run

          | Phase | Output |
          |-------|--------|
          | 1 — Researcher | \`outputs/01-researcher.md\` |
          | 2 — Analyst | \`outputs/02-analyst.md\` |
          | 3 — Strategy Designer | \`outputs/03-strategy-designer.md\` |
          | 4 — MT5 Engineer | \`outputs/04-mt5-engineer.md\` + \`Experts/*.mq5\` |
          | **Final** | **\`outputs/final/latest.md\`** |

          Run ID: ${{ env.RUN_ID }}" || echo "PR may already exist"

      - name: Comment on tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 1 --repo omarrany897-source/mt5-quant-pipeline \
            --body "✅ Pipeline run \`${{ env.RUN_ID }}\` completed. Final output: \`outputs/final/latest.md\`. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" || true

  install-local-expert-advisors:
    needs: finalize
    runs-on: [self-hosted, windows, mt5-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy complete pipeline output to local computer
        shell: powershell
        env:
          MT5_EXPERTS_DIR: 'C:\Users\Laptop\AppData\Roaming\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075\MQL5\Experts'
          MT5_ARCHIVE_DIR: 'C:\Users\Laptop\AppData\Roaming\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075\MQL5\Experts\PipelineOutputs'
          DOWNLOADS_DIR: 'C:\Users\Laptop\Downloads'
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'Experts'
          if (-not (Test-Path $source)) {
          throw "No Experts directory was produced by the completed pipeline."
          }
          $files = @(Get-ChildItem -Path $source -Filter '*.mq5' -File)
          if ($files.Count -eq 0) {
          throw "No .mq5 files were produced by the completed pipeline."
          }
          New-Item -ItemType Directory -Force -Path $env:MT5_EXPERTS_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:DOWNLOADS_DIR | Out-Null
          $archivedEAs = @(Get-ChildItem -Path $env:MT5_ARCHIVE_DIR -Recurse -Filter '*.mq5' -File -ErrorAction SilentlyContinue)
          foreach ($archived in $archivedEAs) {
          $archivedDestination = Join-Path $env:MT5_EXPERTS_DIR $archived.Name
          if (-not (Test-Path $archivedDestination)) {
            Copy-Item -LiteralPath $archived.FullName -Destination $archivedDestination
            Write-Host "Backfilled archived EA $($archived.Name) from $($archived.Directory.Name)"
          }
          }
          foreach ($file in $files) {
          $stem = [IO.Path]::GetFileNameWithoutExtension($file.Name)
          if ($stem -notmatch '^[A-Z0-9]+(?:_[A-Z0-9]+)*_[0-9]+$') {
            throw "Invalid EA filename '$($file.Name)'; expected MARKET_VERSION.mq5."
          }
          $destination = Join-Path $env:MT5_EXPERTS_DIR $file.Name
          if (Test-Path $destination) {
            $market = $stem.Substring(0, $stem.LastIndexOf('_'))
            $version = [int]$stem.Substring($stem.LastIndexOf('_') + 1)
            do {
              $version++
              $destination = Join-Path $env:MT5_EXPERTS_DIR "${market}_${version}.mq5"
            } while (Test-Path $destination)
          }
          Copy-Item -LiteralPath $file.FullName -Destination $destination
          Write-Host "Installed $($file.Name) as $(Split-Path $destination -Leaf) to $env:MT5_EXPERTS_DIR"
          }
          $runArchive = Join-Path $env:MT5_ARCHIVE_DIR "${{ env.RUN_ID }}"
          New-Item -ItemType Directory -Force -Path $runArchive | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'outputs') -Destination $runArchive -Recurse -Force
          Copy-Item -Path $source -Destination $runArchive -Recurse -Force
          Write-Host "Archived complete run output to $runArchive"
          $downloaded = @()
          Get-ChildItem -Path $env:MT5_EXPERTS_DIR -Filter '*.mq5' -File | ForEach-Object {
            $downloadDestination = Join-Path $env:DOWNLOADS_DIR $_.Name
            if (-not (Test-Path $downloadDestination)) {
              Copy-Item -LiteralPath $_.FullName -Destination $downloadDestination
              $downloaded += $_.Name
              Write-Host "Copied $($_.Name) to $env:DOWNLOADS_DIR"
            }
          }
          if ($downloaded.Count -eq 0) {
            Write-Host "All pipeline EAs already exist in $env:DOWNLOADS_DIR"
          }
          $installed = @(Get-ChildItem -Path $env:MT5_EXPERTS_DIR -Filter '*.mq5' -File |
            Where-Object { $_.LastWriteTime -ge (Get-Date).AddMinutes(-10) } |
            Select-Object -ExpandProperty Name)
          if ($installed.Count -eq 0) {
            throw "Local installation completed without a recently written EA file."
          }
          @(
            "EA installation succeeded."
            "Run ID: ${{ env.RUN_ID }}"
            "Installed file(s): $($installed -join ', ')"
            "Destination: $env:MT5_EXPERTS_DIR"
            "Workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'ea-install-summary.txt') -Encoding UTF8

      - name: Email EA installation notification
        if: success()
        shell: powershell
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EA_NOTIFY_TO: ${{ secrets.EA_NOTIFY_TO }}
        run: |
          $required = @('SMTP_SERVER', 'SMTP_PORT', 'SMTP_USERNAME', 'SMTP_PASSWORD', 'EA_NOTIFY_TO')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace((Get-Item "Env:$_").Value) })
          if ($missing.Count -gt 0) {
            Write-Warning "EA email notification skipped; configure repository secrets: $($missing -join ', ')"
            exit 0
          }
          $securePassword = ConvertTo-SecureString $env:SMTP_PASSWORD -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential ($env:SMTP_USERNAME, $securePassword)
          $summary = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'ea-install-summary.txt') -Raw
          Send-MailMessage `
            -SmtpServer $env:SMTP_SERVER `
            -Port ([int]$env:SMTP_PORT) `
            -UseSsl `
            -Credential $credential `
            -From $env:SMTP_USERNAME `
            -To $env:EA_NOTIFY_TO `
            -Subject "MT5 EA installed successfully: run ${{ env.RUN_ID }}" `
            -Body $summary
