name: Auto-Heal & Auto-Retry

on:
  workflow_run:
    workflows: ["Pipeline Orchestrator"]
    types: [completed]

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  auto-fix-and-retry:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout failed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture failure metadata
        id: failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --json jobs,headBranch,headSha > "$RUNNER_TEMP/failure.json"
          gh run view "$RUN_ID" --log > "$RUNNER_TEMP/failure.log"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"

      - name: Install Ollama repair model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:3b

      - name: Diagnose and repair with Ollama
        id: repair
        env:
          RUN_ID: ${{ steps.failure.outputs.run_id }}
          REPAIR_BRANCH: ${{ steps.failure.outputs.branch }}
        run: |
          {
            echo "You are repairing a failed GitHub Actions pipeline."
            echo "Inspect the failure context and checked-out repository."
            echo "Return ONLY a unified diff applicable with: git apply repair.patch"
            echo "If no safe source fix is justified, return exactly NO_SAFE_FIX."
            echo "Do not change generated outputs, disable checks, or invent credentials."
            echo "Failure context:"
            cat "$RUNNER_TEMP/failure.json"
            tail -n 12000 "$RUNNER_TEMP/failure.log"
          } > "$RUNNER_TEMP/repair-prompt.txt"

          ollama run qwen2.5:3b < "$RUNNER_TEMP/repair-prompt.txt" > "$RUNNER_TEMP/repair-response.txt"
          if grep -qx "NO_SAFE_FIX" "$RUNNER_TEMP/repair-response.txt"; then
            echo "Ollama found no safe automatic fix."
            exit 1
          fi
          sed -e '1{/^```diff$/d;}' -e '${/^```$/d;}' \
            "$RUNNER_TEMP/repair-response.txt" > repair.patch
          git apply --check repair.patch
          git apply repair.patch
          bash -n scripts/*.sh
          git diff --check
          git config user.name "ollama-auto-heal[bot]"
          git config user.email "ollama-auto-heal[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(auto-heal): resolve pipeline failure and re-trigger"
          git push origin "HEAD:${REPAIR_BRANCH}"

      - name: Retry failed workflow after repair
        if: steps.repair.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.failure.outputs.run_id }}
        run: gh run rerun "$RUN_ID" --failed

      - name: Report unavailable repair
        if: steps.repair.outcome != 'success'
        run: |
          echo "::error::Auto-heal could not apply a verified repair."
          exit 1
