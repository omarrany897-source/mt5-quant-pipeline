name: Continue EA Pipeline

on:
  workflow_run:
    workflows: ["Pipeline Orchestrator"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: mt5-pipeline-continuation
  cancel-in-progress: false

jobs:
  queue-next-run:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait between completed and next run
        run: sleep 300

      - name: Queue the next EA generation run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pipeline-orchestrator.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            --field trigger_source="continuous-after-${{ github.event.workflow_run.id }}"
